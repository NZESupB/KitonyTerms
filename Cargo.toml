[workspace]
resolver = "2"
members = [
    "crates/kt-core",
    "crates/kt-config",
    "crates/kt-secrets",
    "crates/kt-sync",
    "crates/kt-ui",
    "crates/kt-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["KitonyTerms contributors"]
repository = "https://github.com/nzesupb/KitonyTerms"

# Centralized dependency versions shared across crates.
# Versions are validated/bumped via `cargo add` — treat these as the source of truth.
[workspace.dependencies]
# --- internal crates ---
kt-config = { path = "crates/kt-config" }
kt-secrets = { path = "crates/kt-secrets" }
kt-core = { path = "crates/kt-core" }
kt-ui = { path = "crates/kt-ui" }
kt-sync = { path = "crates/kt-sync" }

# --- async runtime ---
tokio = { version = "1", features = ["rt-multi-thread", "io-util", "net", "sync", "macros", "time", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }

# --- SSH (pure Rust) ---
russh = "0.61"
russh-config = "0.58"
russh-sftp = "2.3"

# --- TCP proxy (SOCKS5 / HTTP CONNECT before SSH handshake) ---
tokio-socks = "0.5.3"
base64 = "0.22.1"

# --- terminal backend (API not stability-guaranteed → pinned) ---
alacritty_terminal = "=0.26.0"

# --- serialization / config ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "stream"] }
url = "2.5"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "http1", "tokio"] }
http-body-util = "0.1"
bytes = "1"
hmac = "0.12"
hex = "0.4"
if-addrs = "0.13"
sha2 = "0.10"
subtle = "2.6"
toml = "0.9"
directories = "6"
fs2 = "0.4.3"
rfd = "0.17.2"

# --- crypto (master-password vault) ---
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = { version = "1", features = ["derive"] }

# --- UI framework ---
# 不限制稳定版本线；Cargo.lock 记录每次更新后实际验证的版本。
dioxus = { version = ">=0", features = ["desktop", "mobile"] }

# --- 桌面端原生剪贴板（绕开 WebView 的系统粘贴确认） ---
arboard = { version = "3.6.1", default-features = false }

# --- Android integration ---
jni = "0.21"
ndk-context = "0.1"

# --- macOS integration ---
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

# --- error handling / logging / utils ---
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
windows-sys = { version = "0.61", features = ["Win32_Globalization", "Win32_Storage_FileSystem", "Win32_System_Console"] }

# --- headless example helpers ---
rpassword = "7"
crossterm = "0.29"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# 本地开发/测试优先控制可重建产物体积：依赖不保留完整调试信息，
# 主项目仍保留行号级调试信息；关闭增量缓存避免多轮 workspace 检查堆积。
[profile.dev]
debug = 1
incremental = false

[profile.dev.package."*"]
debug = 0

[profile.test]
debug = 1
incremental = false

[profile.test.package."*"]
debug = 0
