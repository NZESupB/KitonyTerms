name: Wails release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wails-release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUTF8: '1'
  GOTOOLCHAIN: local

jobs:
  validate:
    name: Go and React checks
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-wails
      - name: Validate release contracts
        run: python3 -B .github/scripts/test-update-manifest.py
      - name: Go race and frontend checks
        working-directory: app
        run: bash scripts/check.sh

  allocate_mobile_build_number:
    name: allocate mobile build number
    needs: validate
    runs-on: ubuntu-24.04
    concurrency:
      group: mobile-build-number
      cancel-in-progress: false
    outputs:
      build_number: ${{ steps.allocate.outputs.build_number }}
      version_label: ${{ steps.metadata.outputs.version_label }}
    steps:
      - uses: actions/checkout@v5
      - name: Read Go project version
        id: metadata
        run: |
          python3 -B - <<'PY'
          import importlib.util, os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('meta', '.github/scripts/generate-update-manifest.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          record = module.identity('stable')
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write('version_label='+record['label']+'\n')
          PY
      - name: Allocate mobile build number
        id: allocate
        run: bash .github/scripts/allocate-mobile-build-number.sh release

  build:
    name: build ${{ matrix.name }}
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: macos-aarch64
            os: macos-15
            target: aarch64-apple-darwin
          - name: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
          - name: windows-x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
          - name: windows-aarch64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev pkg-config libxkbcommon-dev fontconfig
      - name: Prepare Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup 6 missing' }
      - uses: ./.github/actions/setup-wails
      - name: Native Go domain tests
        shell: bash
        working-directory: app
        run: |
          go vet ./...
          go test -count=1 -timeout=600s ./internal/... ./tools/...
      - name: Build and verify desktop package
        shell: bash
        run: python3 -B .github/scripts/build-desktop.py '${{ matrix.target }}'
      - uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  mobile_android:
    name: build android-aarch64
    needs: allocate_mobile_build_number
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: mobile-signing
    env:
      MOBILE_VERSION_LABEL: ${{ needs.allocate_mobile_build_number.outputs.version_label }}
      MOBILE_BUILD_NUMBER: ${{ needs.allocate_mobile_build_number.outputs.build_number }}
    steps:
      - uses: actions/checkout@v5
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev pkg-config libxkbcommon-dev
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android SDK and NDK
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-wails
      - name: Build signed APK and AAB
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
        run: bash .github/scripts/package-android-apk.sh
      - uses: actions/upload-artifact@v6
        with:
          name: release-android-aarch64
          path: dist/*
          if-no-files-found: error

  mobile_ios:
    name: build ios-aarch64 unsigned IPA
    needs: allocate_mobile_build_number
    runs-on: macos-15
    timeout-minutes: 40
    env:
      MOBILE_VERSION_LABEL: ${{ needs.allocate_mobile_build_number.outputs.version_label }}
      MOBILE_BUILD_NUMBER: ${{ needs.allocate_mobile_build_number.outputs.build_number }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-wails
      - name: Link device application and package unsigned IPA
        run: bash .github/scripts/package-ios-ipa.sh
      - uses: actions/upload-artifact@v6
        with:
          name: release-ios-aarch64
          path: dist/*
          if-no-files-found: error

  publish:
    name: verify and publish Wails prerelease
    needs: [validate, build, mobile_android, mobile_ios]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify complete asset set and update manifest
        run: |
          python3 -B .github/scripts/finalize-release.py
          python3 -B .github/scripts/finalize-release.py --verify
      - uses: actions/upload-artifact@v6
        with:
          name: verified-release
          path: dist/*
          if-no-files-found: error
      - name: Publish independent prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c 'import json; print(json.load(open("app/frontend/package.json"))["version"])')
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo '拒绝覆盖已有Release' >&2
            exit 1
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "KitonyTerms $tag · Wails preview" --prerelease --latest=false --draft --notes-file .github/release-notes.md dist/*
          gh release edit "$tag" --draft=false --prerelease --latest=false
